<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Menu</title>
  <script src="hierarchy.js" defer></script>
  <style>
	body {
		margin: 0;
		padding: 0;
		overflow: hidden;
		display: flex;
		height: 100vh;
	}

	.left-panel {
		flex: 4; /* Adjust the ratio for the left side width */
		background-color: black;
		padding: 20px;
		box-sizing: border-box;
		overflow-y: scroll;
	}

	.right-panel {
		flex: 1; /* Adjust the ratio for the right side width */
		background-color: #ddd;
		padding: 20px;
		box-sizing: border-box;
		overflow-y: scroll;
		z-index: 25;
	}
    .first {
	  display: block;
	  border: 1px solid white;
	  background-color: white;
      position: absolute;
	  left: 5px;
	  top: 25px;
	  color: purple;
	}
	.button {
	  display: block;
	  border: 1px solid black;
	  background-color: lightgray;
      position: relative;
	  width:100%;
	  left: 20px;
	  margin-top: 2px;
	  margin-bottom: 0px;
	  color: purple;
	  z-index: 5;
    }
    .buttonLink {	  
	  text-decoration: None;
	  vertical-align: top;
      width: 200px;
	  margin-top: 3px;
	  margin-left: 3px;	
	  color: purple;
	  font-weight: bold;
    }
	.saveLink {
	  text-decoration: None;	
	  color: green;
	  font-weight: bold;
	  cursor: pointer;
	}
	.dropper {
	  text-decoration: None;
	  color: white;
	  background-color: teal;
	  border-radius: 4px;
	  font-size: 0.8em;
	  font-weight: bold;
	  padding: 1px 6px;
	  margin-left: 4px;
	  cursor: copy;
	}
	.category {
	  text-decoration: None;
	  color: white;
	  background-color: rgb(133, 74, 40);
	  border-radius: 4px;
	  font-size: 0.8em;
	  font-weight: bold;
	  padding: 1px 6px;
	  margin-left: 4px;
	  cursor: copy;
	}
	.label {
	  text-decoration: None;
	  color: white;
	  background-color: rgb(22, 88, 44);
	  border-radius: 4px;
	  font-size: 0.8em;
	  font-weight: bold;
	  padding: 1px 6px;
	  margin-left: 4px;
	  cursor: copy;
	}
	.white {
	  background-color: white;
	}
	.yellow {
	  background-color: yellow;
	}
	.orange {
	  background-color: orange;
	}
	.green {
	  background-color: green;
	}
	.blue {
	  background-color: blue;
	}
	.purple {
	  background-color: purple;
	}
	.brown {
	  background-color: brown; 
	}
	.black {
	  background-color: black; 
	}
	.rainbow {
	  background-color: red;
	}
	.leaf {
	  background-color: white;
	}
	.inventoryItem {
		display: block;
		margin-top: 3px;
		margin-left: 3px;	
		width: fit-content;
		padding: 10px;
		border-bottom: 1px solid #ddd;
		cursor: pointer;
	}
    .inventoryItem:hover {
        background-color: #f5f5f5;
	}
	.draggable {	
		background-color: #ddd;
		width: fit-content;
		position: fixed;
		pointer-events: none;
		z-index: 999;
		cursor: move;
		padding: 5px;
	}
  </style>
</head>
<body>

	<div id="base" class="left-panel"></div>
    <div class="right-panel">
        <!-- Content for the right side -->
        <div id="inventory" class="inventory">INVENTORY</div>
	</div>
	
</body>
</html>
