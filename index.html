<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Menu</title>
  <link rel="icon" href="data:;">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="hierarchy.js" defer></script>
  <style>
	body {
		margin: 0;
		padding: 0;
		overflow: hidden;
		display: flex;
		height: 100vh;
	}

	.left-panel {
		flex: 4; /* Adjust the ratio for the left side width */
		background-color: #8C7B70;
		padding: 21px;
		box-sizing: border-box;
		overflow-y: scroll;
	}

	.right-panel {
		flex: 1; /* Adjust the ratio for the right side width */
		background-color: #ddd;
		padding: 21px;
		box-sizing: border-box;
		overflow-y: scroll;
		z-index: 25;
	}
    .first {
      display: block;
      position: absolute;
      left: 5px;
      top: 25px;
    }
    .button {
      display: block;
      border: 1px solid black;
	  border-radius: 13px;
      position: relative;
      width:100%;
      left: 21px;
      top: 8px;
      margin-bottom: 5px;
      z-index: 5;
	}
	.game {
	  margin-top: 8px;
      margin-bottom: 5px;
	  margin-left: 21px;

	  color: #6CA2CC;
		
	}
	.markdown {
		font-family: "Source Serif 4", serif;
	  margin-top: 8px;
      margin-bottom: 5px;
	  margin-left: 21px;
		
	}
	

	.markdown h1,
	.markdown h2,
	.markdown h3 {
		font-family: "Inter", sans-serif;
		font-weight: 600;
	}

	.markdown code,
	.markdown pre {
		font-family: monospace;
	}
    .buttonLink {  
	  text-decoration: None;
	  vertical-align: top;
      width: 200px;
	  margin-top: 6px;
	  margin-left: 6px;	
	  font-weight: bold;
    }
	.saveLink {
	  text-decoration: None;	
	  color: rgb(247, 209, 107);
	  font-weight: bold;
	  cursor: pointer;
	}
	.dropper {
	  text-decoration: None;
	  color: white;
	  background-color: teal;
	  border-radius: 4px;
	  font-size: 0.8em;
	  font-weight: bold;
	  padding: 1px 6px;
	  margin-left: 4px;
	  cursor: copy;
	}
	.inventoryItem {
		display: block;
		margin-top: 3px;
		margin-left: 3px;	
		width: fit-content;
		padding: 10px;
		border-bottom: 1px solid #ddd;
		cursor: pointer;
	}
    .inventoryItem:hover {
        background-color: #f5f5f5;
	}
	.draggable {	
		background-color: #ddd;
		width: fit-content;
		position: fixed;
		pointer-events: none;
		z-index: 999;
		cursor: move;
		padding: 5px;
	}
  </style>
</head>
<body>

	<div id="base" class="left-panel"></div>
    <div class="right-panel">
        <!-- Content for the right side -->
        <div id="inventory" class="inventory">INVENTORY</div>
	</div>
	
</body>
</html>
